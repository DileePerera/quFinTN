[project]
name = "qufintn"
version = "0.1.0"
description = "Quantum-Inspired Tensor Networks for Portfolio Optimization"
readme = "README.md"
authors = [{ name = "Your Name", email = "your@email.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "yfinance>=0.2",
    "scipy>=1.10",
    "cvxpy>=1.3",
    "matplotlib>=3.7",
    "tensornetwork>=0.4.0",      # Google's library
    "quimb>=1.8",                # Alternative powerful TN library
    "plotly>=5.0",
]

[project.optional-dependencies]
dev = ["pytest", "black", "jupyter"]
torch = ["torch>=2.0"]           # For differentiable TNs